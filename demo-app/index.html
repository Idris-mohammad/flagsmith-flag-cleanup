<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Toggle Wars Demo Store</title>
</head>
<body>
  <h1>Demo Store</h1>
  <div id="banner" style="display:none">Free shipping this week!</div>
  <button id="checkout-btn" style="display:none">Checkout</button>

  <script>
    const ENV_KEY = "8jfoMNnyeSMjAvwzRTRci6";

    // Loads the environment's flags and returns an object with hasFeature(name)
    async function loadFlagsmith() {
      const res = await fetch("https://edge.api.flagsmith.com/api/v1/flags/", {
        headers: { "X-Environment-Key": ENV_KEY }
      });
      const flags = await res.json();
      const enabled = new Set(flags.filter(f => f.enabled).map(f => f.feature.name));
      return { hasFeature: name => enabled.has(name) };
    }

    loadFlagsmith().then(flagsmith => {
      // Feature flag evaluation: new_checkout
      if (flagsmith.hasFeature("new_checkout")) {
        document.getElementById("checkout-btn").style.display = "inline-block";
      }
      // Feature flag evaluation: old_banner
      if (flagsmith.hasFeature("old_banner")) {
        document.getElementById("banner").style.display = "block";
      }
    });
  </script>
</body>
</html>
